version: 2

sources:
  - name: raw
    description: "Raw source tables."
    database: SNOWFLAKE_DBT
    schema: SF_DBT

    tables:
      - name: customers
        description: "Raw customer master table."

        columns:
          - name: customer_id
            description: "Unique customer identifier."
            tests:
              - not_null
              - unique

          - name: customer_name
            description: "Customer full name."
            tests:
              - not_null

          - name: email
            description: "Customer email address."

          - name: phone
            description: "Customer phone number."

          - name: address
            description: "Customer address."

          - name: updated_at
            description: "Timestamp when the customer record was last updated."
            tests:
              - not_null

      - name: department
        description: "Department master table."

        columns:
          - name: department_id
            description: "Unique department identifier."
            tests:
              - not_null
              - unique

          - name: department_name
            description: "Department name."
            tests:
              - not_null

          - name: department_head
            description: "Head of the department."

          - name: location
            description: "Department location."

          - name: budget
            description: "Allocated department budget."

          - name: status
            description: "Department status (ACTIVE/INACTIVE)."

          - name: created_date
            description: "Record creation date."
            tests:
              - not_null

          - name: updated_at
            description: "Timestamp when the department record was last updated."
            tests:
              - not_null
      - name: sales
        description: "Raw sales master table."

      - name: customer
        description: "This customer table is creaed to implement merge strategy of incremental materialization"

      - name: marketing
        description: "This marketing table is creaed to implement merge strategy of incremental materialization"

  - name: raw_gold
    description: "Raw source tables in gold schema."
    database: SNOWFLAKE_DBT
    schema: GOLD

    tables:
      - name: employee
        description: "Employee master table."

      - name: emp_sales
        description: "Sales related to the employee"